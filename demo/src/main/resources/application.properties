server.port=${PORT:8080}
spring.application.name=demo
spring.profiles.active=prod

# Default MySQL Configuration (Production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Prayer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Let Flyway manage schema creation, Hibernate only validates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Suppress broken pipe errors from client disconnections
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=WARN
logging.level.org.apache.catalina.connector.ClientAbortException=OFF