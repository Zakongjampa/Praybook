############################################
# Production configuration
# Mirrors the settings in application-dev.properties
# but uses MySQL and disables dev‑only tools.
############################################

# Server
server.port=${PORT:8080}
spring.application.name=demo

# MySQL datasource – values injected via environment variables
spring.datasource.url=jdbc:${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate – let Flyway manage the schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Logging – keep root INFO, reduce noise from Spring
logging.level.root=INFO
logging.level.com.prayer.demo=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=WARN
logging.level.org.apache.catalina.connector.ClientAbortException=OFF
